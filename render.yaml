# Render blueprint: New + -> Blueprint -> pick the repo. Set the two secrets in the dashboard.
services:
  - type: web
    name: disney-cruise-data
    runtime: python
    plan: free
    rootDir: app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
